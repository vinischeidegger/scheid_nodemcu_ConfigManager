[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    symlink://../.. ; Link to the library source code for development
lib_extra_dirs = ..
extra_scripts = pre:../../scripts/config_manager_assets.py