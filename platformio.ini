; ---------------------------------------------------------
; GLOBAL SETTINGS (Inherited by all environments below)
; ---------------------------------------------------------
[env]
lib_deps =
    ottowinter/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
build_src_filter = +<src> +<include> -<.git> -<examples> -<test>
test_build_src = yes

; ---------------------------------------------------------
; HARDWARE ENVIRONMENT (NodeMCU)
; ---------------------------------------------------------
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
test_framework = unity
test_filter = test_embedded_* ; Only runs tests meant for hardware
build_src_filter = +<src> +<include> -<.git> -<examples> -<test>
test_build_src = yes

; ---------------------------------------------------------
; NATIVE ENVIRONMENT (PC Testing)
; ---------------------------------------------------------
[env:native]
platform = native
test_framework = googletest
test_filter = test_logic_* ; Only runs pure C++ logic tests
build_flags = -I test/mocks
build_src_filter = +<src> +<include> -<.git> -<examples> -<test>
test_build_src = yes